[project]
name = "ricerca"
version = "1.3.0"
description = "Assistente di strategia di ricerca bibliografica: suggerisce parole chiave e interroga i motori accademici"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
ricerca = "ricerca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ricerca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
