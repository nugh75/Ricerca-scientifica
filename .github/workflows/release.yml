name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archivi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Test
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

      - name: Costruisci gli archivi
        run: ./scripts/crea-release.sh

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le versioni con lettere (b1, rc1) sono anteprime: GitHub le
          # segnala come tali e non le propone come ultima stabile. La «v»
          # del tag non conta, altrimenti sarebbero anteprime tutte.
          VERSIONE="${GITHUB_REF_NAME#v}"
          ANTEPRIMA=""
          case "$VERSIONE" in *[a-z]*) ANTEPRIMA="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* $ANTEPRIMA \
            --title "Ricerca ${{ github.ref_name }}" \
            --notes "$(cat <<'NOTE'
          ## English

          **Stable.** The name of every stored file and the shape of every saved
          format are fixed: what this version writes, later versions read.
          Problems and suggestions: open an issue.

          ### New in 2.3.0

          - Settings chooses how the app opens: a window of its own, without
            address bar or tabs, or an ordinary browser tab like any other site.
          - It also chooses which browser to lean on, among those found on the
            machine — listed by name, not by executable — or the system default,
            which always opens a tab. Only Chromium-family browsers can give a
            window of its own, so picking the default switches to a tab rather
            than failing to open.
          - The choice lives in the configuration, so it holds for the launcher
            too. `--scheda` and the new `--browser` override it for one launch.
          - A browser chosen and later uninstalled no longer stands in the way:
            the app goes back to looking on its own.

          ### In 2.2.0

          - Every record carries a free note: what this article is for, which
            page to reread, what does not add up. It stays with the record, can
            be shown as a column and travels into the CSV.
          - A review corpus now follows the searches it came from. A name fixed
            by hand or a field filled in by Unpaywall reaches the project
            instead of stopping at the photograph taken on the day of linking.
          - It does not follow them silently: every departure from the linked
            version is recorded with the previous value and the date, readable
            on the record under **Metadata changed** and written into the
            Markdown export.
          - The note is shared and written from both sides — from the record
            card and from the screening card.
          - A retraction is never undone by the alignment, and if the original
            search has been deleted the corpus still stands on the copy it kept.

          ### In 2.1.0

          - Deleting asks first. Clearing the history or removing a saved
            search wants a confirmation; a review project — protocol,
            screening, extractions and synthesis — is deleted only by typing
            its title back.
          - A screening decision inside a review swaps that record alone, and
            the counts update around it. «i», «f», «e» and the arrows work
            there too. Without JavaScript the whole page still comes back.
          - The library opens the PDF it found the phrase in, in the reader
            inside the app.
          - Results take the address of the saved search: reloading no longer
            loses them, and the last five searches sit on the front page.
          - The history is filtered by topic and split into pages, and a saved
            search reopens ready to run again, filters included.
          - A single record joins a review without linking the whole search, a
            review project can be renamed, and extraction and critical
            appraisal are split into pages.

          ### In 2.0.1

          - The guidance mark in the protocol form is a centred icon.

          ### In 2.0.0

          - Screening a record swaps that record alone. The keyboard flow
            survives the decision, so «i», «f», «e» and the arrows keep working
            down a long list instead of dying after the first click.
          - The reason field opens when there is a decision to explain, and
            stays out of the way on the rows that have none.
          - The search strings are shown right above **Run the search**, and
            they follow the blocks as they are edited: no button to remember,
            and nothing is sent before it has been read. Niche OpenAlex filters
            start folded.
          - The closing stages of a review — extraction, appraisal, synthesis,
            wiki, updates — arrive when they come into view, so opening a large
            project no longer means building thousands of fields nobody is
            looking at.
          - A filter that matches nothing now offers the way back out.

          Download the archive for your system, extract it and run the installer.

          | System | File | How to start |
          |---|---|---|
          | macOS | `ricerca-*-macos.tar.gz` | double-click `install-or-update.command` |
          | Windows | `ricerca-*-windows.zip` | double-click `install-or-update.bat` |
          | Linux | `ricerca-*-linux.tar.gz` | run `./install-or-update.sh` |

          Upgrading from a 1.0.0bN beta: run the same installer. Searches,
          review workspaces, settings and PDFs stay in place.

          Python is not required: on first run the launcher downloads `uv` into
          the app folder, with no system changes and no admin rights. Only an
          internet connection is needed.

          The app opens in its own window, with no browser chrome. On Safari:
          Share → Add to Dock; on Chrome or Edge: Install app.

          The courtesy email and the API keys are entered from the interface,
          under Settings. Closing the window quits the app.

          ## Italiano

          **Stabile.** I nomi dei file salvati e la forma dei formati sono
          fermi: quello che scrive questa versione, le prossime lo rileggono.
          Problemi e proposte: apri una segnalazione.

          ### Novità in 2.3.0

          - In Impostazioni si sceglie come si apre l'app: in una finestra
            propria, senza barra degli indirizzi né schede, oppure in una
            normale scheda del browser, come un sito qualsiasi.
          - Si sceglie anche su quale browser appoggiarsi, fra quelli trovati
            sulla macchina — elencati per nome, non per eseguibile — oppure
            quello predefinito di sistema, che apre sempre una scheda. La
            finestra propria la sanno dare solo i browser della famiglia
            Chromium: scegliendo il predefinito si passa alla scheda invece di
            non aprire niente.
          - La scelta vive nella configurazione, quindi vale anche per il
            lanciatore. `--scheda` e il nuovo `--browser` la scavalcano per un
            avvio soltanto.
          - Un browser scelto e poi disinstallato non blocca più l'avvio: si
            torna a cercare.

          ### Nella 2.2.0

          - Ogni record porta un appunto libero: a che cosa serve questo
            articolo, quale pagina rileggere, che cosa non torna. Sta con il
            record, si può mostrare come colonna e finisce nel CSV.
          - Il corpus di una review segue ora le ricerche da cui viene. Un nome
            sistemato a mano o un campo completato da Unpaywall arriva nel
            progetto, invece di fermarsi alla fotografia del giorno del
            collegamento.
          - Non le segue in silenzio: ogni scostamento dalla versione collegata
            viene registrato con il valore di prima e la data, si legge sul
            record sotto **Metadati cambiati** ed entra nell'export Markdown.
          - L'appunto è condiviso e si scrive dai due lati — dalla scheda del
            record e da quella dello screening.
          - Un ritiro non viene mai annullato dall'allineamento, e se la ricerca
            d'origine è stata cancellata il corpus regge sulla copia conservata.

          ### Nella 2.1.0

          - Le cancellazioni chiedono. Svuotare la cronologia o togliere una
            ricerca salvata vuole una conferma; un progetto di review —
            protocollo, screening, estrazioni e sintesi — si cancella soltanto
            riscrivendone il titolo.
          - Una decisione di screening dentro una review scambia quel record
            soltanto, e i conteggi si aggiornano attorno. Anche lì valgono
            «i», «f», «e» e le frecce. Senza JavaScript torna la pagina intera.
          - La biblioteca apre il PDF in cui ha trovato la frase, nel lettore
            dentro l'app.
          - I risultati prendono l'indirizzo della ricerca salvata: ricaricare
            non li perde più, e le ultime cinque stanno in prima pagina.
          - La cronologia si filtra per argomento e si divide in pagine, e una
            ricerca salvata si riapre pronta da rilanciare, filtri compresi.
          - Un singolo record entra in una review senza collegare tutta la
            ricerca, un progetto di review si può rinominare, ed estrazione e
            valutazione critica si dividono in pagine.

          ### Nella 2.0.1

          - Il segno di guida del protocollo è un'icona centrata.

          ### Nella 2.0.0

          - Valutare un record scambia quel record soltanto. Il lavoro da
            tastiera sopravvive alla decisione: «i», «f», «e» e le frecce
            continuano a funzionare lungo tutto l'elenco invece di spegnersi al
            primo clic.
          - Il campo del motivo si apre quando c'è una decisione da spiegare e
            resta chiuso sulle righe che non ne hanno.
          - Le stringhe di ricerca stanno appena sopra **Avvia la ricerca** e
            seguono i blocchi mentre li si modifica: nessun bottone da
            ricordare, e niente parte prima di essere stato letto. I filtri
            OpenAlex di nicchia partono chiusi.
          - Le fasi finali di una review — estrazione, valutazione, sintesi,
            wiki, aggiornamenti — arrivano quando si guardano: aprire un
            progetto grande non significa più costruire migliaia di campi che
            nessuno sta leggendo.
          - Un filtro che non trova nulla propone l'uscita.

          Scarica l'archivio del tuo sistema, estrailo e avvia l'installatore.

          | Sistema | File | Come si avvia |
          |---|---|---|
          | macOS | `ricerca-*-macos.tar.gz` | doppio clic su `install-or-update.command` |
          | Windows | `ricerca-*-windows.zip` | doppio clic su `install-or-update.bat` |
          | Linux | `ricerca-*-linux.tar.gz` | esegui `./install-or-update.sh` |

          Se arrivi da una beta 1.0.0bN: avvia lo stesso installatore. Ricerche,
          workspace di review, impostazioni e PDF restano dove sono.

          Non serve installare Python: al primo avvio il lanciatore scarica
          `uv` nella cartella dell'app, senza toccare il sistema e senza
          permessi di amministratore. Serve solo una connessione a internet.

          L'app si apre in una finestra propria, senza barre. Con Safari:
          Condividi → Aggiungi al Dock; con Chrome o Edge: Installa
          applicazione.

          Email di cortesia e chiavi API si inseriscono dall'interfaccia, in
          Impostazioni. Chiudendo la finestra l'app si chiude da sola.
          NOTE
          )"
