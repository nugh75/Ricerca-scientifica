name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pyinstaller
        working-directory: backend
      - name: Build
        run: pyinstaller --distpath dist --workpath build packaging/litreview.spec
        working-directory: backend
      - name: Smoke test
        shell: powershell
        working-directory: backend
        run: |
          $env:LITREVIEW_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\litreview-backend-windows.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8756/docs" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep 1 }
          }
          # keyring: Windows runner has a native keyring -> 200 expected
          $keysOk = $false
          if ($ok) {
            for ($i = 0; $i -lt 5; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8756/settings/keys" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $keysOk = $true; break }
              } catch { Start-Sleep 1 }
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "smoke test fallito: /docs non risponde" }
          if (-not $keysOk) { throw "smoke test fallito: /settings/keys non raggiungibile" }
          Write-Output "SMOKE OK"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: backend/dist/litreview-backend-windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pyinstaller
        working-directory: backend
      - name: Build
        run: pyinstaller --distpath dist --workpath build packaging/litreview.spec
        working-directory: backend
      - name: Smoke test
        working-directory: backend
        run: |
          LITREVIEW_NO_BROWSER=1 ./dist/litreview-backend-macos &
          PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8756/docs >/dev/null; then ok=1; break; fi
            sleep 1
          done
          # keyring: macOS runner has a native keyring -> 200 expected
          keys_ok=""
          if [ -n "$ok" ]; then
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" http://127.0.0.1:8756/settings/keys || true)
            if [ "$code" = "200" ]; then keys_ok=1; fi
          fi
          kill $PID 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke test fallito: /docs non risponde"; exit 1; }
          [ -n "$keys_ok" ] || { echo "smoke test fallito: /settings/keys non raggiungibile (HTTP ${code:-nessuna risposta})"; exit 1; }
          echo "SMOKE OK"
      - name: Package DMG
        working-directory: backend
        run: |
          STAGING="$(mktemp -d)/LitReview"
          mkdir -p "$STAGING"
          cp packaging/launchers/litreview.command "$STAGING/"
          chmod +x "$STAGING/litreview.command"
          hdiutil create -volname LitReview -srcfolder "$STAGING" -ov -format UDZO dist/litreview-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: backend/dist/litreview-backend-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: backend/dist/litreview-macos.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pyinstaller
        working-directory: backend
      - name: Build
        run: pyinstaller --distpath dist --workpath build packaging/litreview.spec
        working-directory: backend
      - name: Smoke test
        working-directory: backend
        run: |
          LITREVIEW_NO_BROWSER=1 ./dist/litreview-backend-linux &
          PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8756/docs >/dev/null; then ok=1; break; fi
            sleep 1
          done
          # keyring: runner is headless (no Secret Service) -> 200 or 503 ok
          keys_ok=""
          if [ -n "$ok" ]; then
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" http://127.0.0.1:8756/settings/keys || true)
            case "$code" in
              200|503) keys_ok=1 ;;
            esac
          fi
          kill $PID 2>/dev/null || true
          [ -n "$ok" ] || { echo "smoke test fallito: /docs non risponde"; exit 1; }
          [ -n "$keys_ok" ] || { echo "smoke test fallito: /settings/keys non raggiungibile (HTTP ${code:-nessuna risposta})"; exit 1; }
          echo "SMOKE OK"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: backend/dist/litreview-backend-linux

  build-desktop-windows:
    needs: build-windows
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: backend/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare sidecar
        working-directory: frontend
        run: npm run prepare-sidecar
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build installer
        working-directory: frontend
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe

  build-desktop-macos:
    needs: build-macos
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-binary
          path: backend/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Prepare sidecar
        working-directory: frontend
        run: npm run prepare-sidecar
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build installer
        working-directory: frontend
        run: npm run tauri build -- --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-desktop-linux:
    needs: build-linux
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: backend/dist
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare sidecar
        working-directory: frontend
        run: npm run prepare-sidecar
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build installer
        working-directory: frontend
        run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [build-windows, build-macos, build-linux, build-desktop-windows, build-desktop-macos, build-desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-binary"
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: "desktop-*"
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/litreview-backend-windows.exe
            artifacts/litreview-backend-macos
            artifacts/litreview-backend-linux
            artifacts/litreview-macos.dmg
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            backend/packaging/launchers/litreview.bat
            backend/packaging/launchers/litreview-unix.sh
            backend/packaging/launchers/litreview.command
