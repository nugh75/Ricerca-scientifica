name: contratti

# Le API cambiano senza avvisare: una volta a settimana si interrogano
# davvero, per accorgersene prima che se ne accorga chi usa l'app.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  api-reali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -m rete -v tests/contratto
