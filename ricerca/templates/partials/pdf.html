{% if scaricato %}
<button type="button" class="copia" data-pdf="/pdf/{{ id_ricerca }}/{{ indice }}/file"
        data-titolo="{{ work.title }}">{{ t.pdf_open }}</button>
{% elif work.oa_url %}
<button type="button" class="copia" hx-post="/pdf/{{ id_ricerca }}/{{ indice }}"
        hx-target="this" hx-swap="outerHTML">{{ t.pdf_download }}</button>
{% if errore %}<em class="errore">{{ t.pdf_error }}: {{ errore }}</em>{% endif %}
{% else %}<span class="assente">{{ t.pdf_none }}</span>{% endif %}
