{% macro icona(nome) -%}
<svg class="icona" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {% if nome == "copy" %}
  <rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path>
  {% elif nome == "close" %}
  <path d="m6 6 12 12M18 6 6 18"></path>
  {% elif nome == "external" %}
  <path d="M15 4h5v5M20 4l-9 9"></path><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"></path>
  {% elif nome == "table" %}
  <rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18M8 5v14"></path>
  {% elif nome == "list" %}
  <path d="M8 6h13M8 12h13M8 18h13"></path><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path>
  {% elif nome == "previous" %}
  <path d="m15 18-6-6 6-6"></path>
  {% elif nome == "next" %}
  <path d="m9 18 6-6-6-6"></path>
  {% elif nome == "protocol" %}
  <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h6"></path>
  {% elif nome == "results" %}
  <path d="M4 19V9M10 19V5M16 19v-7M22 19V3"></path>
  {% elif nome == "field" %}
  <path d="M4 19h16M6 16l4-5 3 3 5-8"></path><circle cx="18" cy="6" r="1.5"></circle>
  {% elif nome == "sliders" %}
  <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle>
  {% elif nome == "comfortable" %}
  <path d="M4 7h16M4 12h16M4 17h16"></path>
  {% elif nome == "compact" %}
  <path d="M4 9h16M4 15h16"></path>
  {% elif nome == "light" %}
  <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
  {% elif nome == "dark" %}
  <path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4z"></path>
  {% elif nome == "auto" %}
  <rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path>
  {% endif %}
</svg>
{%- endmacro %}
