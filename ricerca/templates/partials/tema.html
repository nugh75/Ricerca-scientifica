<span class="temi" id="temi">
  {% for nome, etichetta in (('chiaro', t.theme_light), ('auto', t.theme_auto), ('scuro', t.theme_dark)) %}
  <button type="button" class="scelta-preferenza {% if tema == nome %}attiva{% endif %}"
          hx-post="/tema/{{ nome }}" hx-target="#temi" hx-swap="outerHTML"
          aria-pressed="{{ 'true' if tema == nome else 'false' }}"
          onclick="document.documentElement.setAttribute('data-tema', '{{ nome }}')">{{ etichetta }}</button>
  {% endfor %}
</span>
