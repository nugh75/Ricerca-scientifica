{% if config.mailto %}
<p class="nota">Email di cortesia attiva: <b>{{ config.mailto }}</b> — OpenAlex applica i limiti più larghi.</p>
{% else %}
<form class="nota" hx-post="/mailto" hx-target="#cortesia">
  <label for="mailto-veloce">Senza email di cortesia OpenAlex risponde spesso <b>429</b>. Inseriscila una volta sola:</label>
  <span class="riga-mailto">
    <input id="mailto-veloce" name="mailto" type="email" required placeholder="nome@esempio.it">
    <button type="submit">Salva</button>
  </span>
</form>
{% endif %}
