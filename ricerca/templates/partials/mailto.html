{% if config.mailto %}
<p class="nota">{{ t.mailto_active }} <b>{{ config.mailto }}</b> {{ t.mailto_active_tail }}</p>
{% else %}
<form class="nota" hx-post="/mailto" hx-target="#cortesia">
  <label for="mailto-veloce">{{ t.mailto_prompt|safe }}</label>
  <span class="riga-mailto">
    <input id="mailto-veloce" name="mailto" type="email" required placeholder="{{ t.mailto_placeholder }}">
    <button type="submit">{{ t.btn_save }}</button>
  </span>
</form>
{% endif %}
