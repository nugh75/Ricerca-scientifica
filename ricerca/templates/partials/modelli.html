{% if error %}<p class="nota errore">{{ t.endpoint_unreachable }} {{ error }}</p>
{% elif models %}<p class="aiuto">
  {% for m in models %}<button type="button" class="chip" onclick="document.getElementById('llm_model').value='{{ m }}'">{{ m }}</button>{% endfor %}</p>
{% else %}<p class="nota">{{ t.no_models }}</p>{% endif %}
