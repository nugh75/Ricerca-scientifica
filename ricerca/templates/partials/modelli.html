{% if error %}<p class="nota errore">Endpoint non raggiungibile: {{ error }}</p>
{% elif models %}<p class="aiuto">Modelli disponibili:
  {% for m in models %}<button type="button" class="chip" onclick="document.getElementById('llm_model').value='{{ m }}'">{{ m }}</button>{% endfor %}</p>
{% else %}<p class="nota">L'endpoint non elenca modelli.</p>{% endif %}
