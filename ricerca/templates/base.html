<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ricerca{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="/static/icona.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">Ricerca<span>{{ t.brand_sub }}</span></a>
  <nav>
    <a href="/">{{ t.nav_strategy }}</a>
    <a href="/cronologia">{{ t.nav_history }}</a>
    <a href="/biblioteca">{{ t.nav_library }}</a>
    <a href="/impostazioni">{{ t.nav_settings }}</a>
    <span class="lingue">
      <button type="button" class="lingua {% if lang == 'it' %}attiva{% endif %}" hx-post="/lingua/it" hx-target="body" hx-swap="outerHTML" lang="it">IT</button>
      <button type="button" class="lingua {% if lang == 'en' %}attiva{% endif %}" hx-post="/lingua/en" hx-target="body" hx-swap="outerHTML" lang="en">EN</button>
    </span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>{{ t.footer }}</footer>
<script>
// Battito: finché una pagina è aperta il server resta vivo. Quando l'ultima
// si chiude, il processo si ferma da solo — non c'è un terminale dove farlo.
setInterval(function () {
  fetch("/battito", { method: "POST", keepalive: true }).catch(function () {});
}, 4000);
fetch("/battito", { method: "POST" }).catch(function () {});
window.addEventListener("pagehide", function () {
  navigator.sendBeacon ? navigator.sendBeacon("/chiudi") : fetch("/chiudi", { method: "POST", keepalive: true });
});

function spunta(id, valore) {
  document.querySelectorAll('input[form="massa-' + id + '"][name="selezione"]')
    .forEach(function (casella) { casella.checked = valore; });
}

document.addEventListener("click", function (event) {
  const bottone = event.target.closest("[data-copia]");
  if (!bottone || !navigator.clipboard) return;
  navigator.clipboard.writeText(bottone.getAttribute("data-copia")).then(function () {
    const testo = bottone.textContent;
    bottone.textContent = bottone.getAttribute("data-copiato");
    setTimeout(function () { bottone.textContent = testo; }, 1500);
  });
});
</script>
</body>
</html>
